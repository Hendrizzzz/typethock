services:
  - type: web
    name: typethock-api
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/Hendrizzzz/typethock
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    autoDeployTrigger: "off"
    buildFilter:
      paths:
        - backend/**
        - .dockerignore
        - render.yaml
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: TYPETHOCK_COOKIE_SECURE
        value: "true"
      - key: TYPETHOCK_FLYWAY_ENABLED
        value: "true"
      - key: TYPETHOCK_REQUIRE_VERIFIED_DATABASE_TLS
        value: "true"
      - key: TYPETHOCK_MAX_RESULTS_PER_ACCOUNT
        value: "100"
      - key: TYPETHOCK_MAX_SESSIONS_PER_ACCOUNT
        value: "5"
      - key: TYPETHOCK_DATABASE_MAX_POOL_SIZE
        value: "5"
      - key: TYPETHOCK_DATABASE_MIN_IDLE
        value: "0"
      - key: TYPETHOCK_MAX_AUTH_ATTEMPTS_PER_MINUTE
        value: "30"
      - key: TYPETHOCK_MAX_REGISTRATIONS_PER_HOUR
        value: "60"
      - key: TYPETHOCK_DATABASE_URL
        sync: false
      - key: TYPETHOCK_DATABASE_USERNAME
        sync: false
      - key: TYPETHOCK_DATABASE_PASSWORD
        sync: false
      - key: TYPETHOCK_FLYWAY_URL
        sync: false
      - key: TYPETHOCK_FLYWAY_USERNAME
        sync: false
      - key: TYPETHOCK_FLYWAY_PASSWORD
        sync: false
